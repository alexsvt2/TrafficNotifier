# Copia este archivo a config.toml y llénalo. config.toml no se sube a git.

# API key de Google Cloud con Routes API habilitada (ver README).
google_api_key = "..."

# Topic de ntfy. Los topics son públicos: usa un nombre difícil de adivinar.
ntfy_topic = "..."
# ntfy_server = "https://ntfy.sh"

[schedule]
# Solo se revisa dentro de este horario (todos los días).
start = "07:00"
end = "22:00"
interval_minutes = 30   # cada cuánto revisa solo

[command]
# Manda este texto al topic desde la app ntfy para revisar al momento
# (sin importar mayúsculas). La siguiente revisión automática se recorre.
keyword = "revisar"
cooldown_minutes = 2    # mínimo entre revisiones a demanda
# "detener" pausa las revisiones automáticas hasta el día siguiente a la hora
# de inicio; "iniciar" las reanuda antes. En pausa, dentro del horario, llega
# un recordatorio cada reminder_minutes de que sigue conectado.
stop = "detener"
start = "iniciar"
reminder_minutes = 60

[thresholds]
# tiempo con tráfico / tiempo normal
moderate = 1.15   # >= 15% más lento → 🟡
heavy = 1.40      # > 40% más lento → 🔴

[map]
# Cuando una ruta sale en 🔴, adjunta un mapa con los tramos lentos (naranja)
# y atascados (rojo). Cada imagen cuesta una consulta Compute Routes Enterprise
# por ruta (1,000 gratis al mes), por eso hay un mínimo entre imágenes.
enabled = true
every_minutes = 60      # una imagen por ruta como máximo cada tanto

# Lugares con etiqueta, opcional: se pueden usar como origin/destination.
# También se manejan con `python -m traffic_notifier place add ...` (ver README).
# [places]
# Casa = "19.4326,-99.1332"

# Origen y destino: etiqueta de un lugar, dirección en texto o "lat,lng".
[[routes]]
name = "Casa → Trabajo"
origin = "19.4326,-99.1332"
destination = "Paseo de la Reforma 222, Ciudad de México"

[[routes]]
name = "Trabajo → Casa"
origin = "Paseo de la Reforma 222, Ciudad de México"
destination = "19.4326,-99.1332"
